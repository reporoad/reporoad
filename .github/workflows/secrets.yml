name: Secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  betterleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned BetterLeaks
        run: bash scripts/security/install-betterleaks.sh
      - name: Scan Git history and enforce secret-file exclusions
        run: node scripts/security/scan.mjs
